# Requests far more than it uses, so right-sizing has something to recommend (scenario 09).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oversized
  template:
    metadata:
      labels:
        app: oversized
    spec:
      nodeSelector:
        ocean-lab/vng: general
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
