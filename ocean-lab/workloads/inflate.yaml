# Placeholder pods that only reserve capacity. Scale replicas to make Ocean add or remove nodes.
# The selector keeps them on the general VNG, off the managed node group and the other VNGs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      nodeSelector:
        ocean-lab/vng: general
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1.5Gi
